      <stop offset="0" stop-color="#1b2550"/>
      <stop offset="1" stop-color="#070b1a"/>
    </radialGradient>
    <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
