name: Make a video

on:
  schedule:
    # Three chances a day (about 10am, 2pm and 6pm New York). Each run makes a video only while
    # today's count is below "Videos per day" in Settings, so 1/day means only the first run does work.
    - cron: '7 14 * * *'
    - cron: '7 18 * * *'
    - cron: '7 22 * * *'
  workflow_dispatch:
    inputs:
      manual:
        description: 'Started from the app ("Make a video now")'
        required: false
        default: 'true'
      subject:
        description: 'Subject (optional), e.g. "iPhone 18". Leave empty for the top trend.'
        required: false
        default: ''
      pick:
        description: 'Category for this video (optional), e.g. "gaming" or "gaming:nintendo"'
        required: false
        default: ''
      idea_url:
        description: 'Link of the idea picked in the app (optional, filled in by the app)'
        required: false
        default: ''
      extras:
        description: 'Extras for this video (optional, filled in by the app): quiz, fast, cover (comma separated)'
        required: false
        default: ''
      render_id:
        description: 'Build the video for a checked script (filled in by the app)'
        required: false
        default: ''
      sample:
        description: 'Test only: a made-up sample video (no AI cost, not added to the app) to check voice and music'
        type: boolean
        required: false
        default: false

concurrency:
  group: make-video
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  make:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Timer runs only: a few seconds to check Settings (and run the auto clean-up). When no video is due
      # (scheduled videos off, or today's videos already made), every step below is skipped.
      - name: Is a video due?
        id: check
        if: github.event_name == 'schedule'
        run: npx tsx pipeline/check.ts
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      - name: Install the natural voice (Kokoro)
        if: steps.check.outputs.due != 'false'
        run: npm install --no-save --no-audit --no-fund kokoro-js@1.2.1
      - name: Install ffmpeg and caption font
        if: steps.check.outputs.due != 'false'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Cache the voice program
        id: piper-cache
        if: steps.check.outputs.due != 'false'
        uses: actions/cache/restore@v5
        with:
          path: .piper
          key: piper-2023.11.14-2-amy-ryan-medium
      - name: Download the voice program (Piper) and two voices
        if: steps.check.outputs.due != 'false' && steps.piper-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .piper
          get() { curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o "$1" "$2"; }
          get piper.tar.gz https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz
          tar -xzf piper.tar.gz -C .piper && rm piper.tar.gz
          V=https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/en/en_US
          for p in amy/medium/en_US-amy-medium ryan/medium/en_US-ryan-medium; do
            n=$(basename $p)
            get .piper/$n.onnx "$V/$p.onnx"
            get .piper/$n.onnx.json "$V/$p.onnx.json"
          done
          ls -la .piper
      - name: Keep the voice program for next time
        if: steps.check.outputs.due != 'false' && steps.piper-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .piper
          key: piper-2023.11.14-2-amy-ryan-medium
      - name: Make the video
        timeout-minutes: 15
        if: steps.check.outputs.due != 'false'
        run: npm run generate
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          PIPER_DIR: .piper
          SUBJECT: ${{ inputs.subject }}
          PICK: ${{ inputs.pick }}
          EXTRAS: ${{ inputs.extras }}
          IDEA_URL: ${{ inputs.idea_url }}
          RENDER_ID: ${{ inputs.render_id }}
          SAMPLE: ${{ inputs.sample && '1' || '0' }}
          SAVE_COPY_DIR: done
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
          EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
          EMAILJS_USER_ID: ${{ secrets.EMAILJS_USER_ID }}
          EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
      - name: Attach the video to this run (download it under "Artifacts")
        if: always() && steps.check.outputs.due != 'false'
        uses: actions/upload-artifact@v6
        with:
          name: video
          path: done/
          if-no-files-found: ignore
          retention-days: 7
