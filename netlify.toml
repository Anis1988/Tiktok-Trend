[build]
  command = "npm run build"
  publish = "build"
  # Skip the Netlify build (and its credits) when only the GitHub jobs or the video pipeline changed.
  # The Android app (branch "android") is built by GitHub, not Netlify: always skipped here.
  ignore = "[ \"$BRANCH\" = \"android\" ] || git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude).github' ':(exclude)pipeline' ':(exclude)README.md'"

[build.environment]
  NODE_VERSION = "20"
  # GH_REPO is only the repository name (also the default in netlify/lib/github.ts), not a secret.
  SECRETS_SCAN_OMIT_KEYS = "GH_REPO"

[dev]
  command = "npm run dev"
  targetPort = 5173
  framework = "#custom"

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
