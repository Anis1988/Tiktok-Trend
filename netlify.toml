[build]
  command = "npm run build"
  publish = "build"
  # Skip the Netlify build (and its credits) when only the GitHub jobs or the video pipeline changed.
  # The Android app (branch "android") is built by GitHub, not Netlify: always skipped here.
  # Exit 0 = skip. When Netlify has no last-built commit (its cache was lost, so CACHED_COMMIT_REF is empty), or it
  # equals this one, or git can't compare them, it builds: an empty ref made the plain diff say "no change" and skip
  # every deploy since Oct 15.
  ignore = "[ \"$BRANCH\" = \"android\" ] || { [ -n \"$CACHED_COMMIT_REF\" ] && [ \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude).github' ':(exclude)pipeline' ':(exclude)README.md'; }"

[build.environment]
  NODE_VERSION = "20"
  # GH_REPO is only the repository name (also the default in netlify/lib/github.ts), not a secret.
  SECRETS_SCAN_OMIT_KEYS = "GH_REPO"

[dev]
  command = "npm run dev"
  targetPort = 5173
  framework = "#custom"

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
